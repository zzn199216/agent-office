name: Windows build
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'web/**', 'tests/**', 'scripts/**', 'integrations/**', 'package*.json', '.github/workflows/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: AgentOffice-windows-x64
          path: release/AgentOffice-*-windows-x64.zip
          if-no-files-found: error
